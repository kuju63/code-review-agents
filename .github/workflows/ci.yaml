name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  ci-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm + Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm run lint
      - name: Run type checker
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: coverage
      - name: Build node-runtime image (validation only, not pushed)
        run: docker build --target node-runtime -t code-review-agent:node-runtime-ci .