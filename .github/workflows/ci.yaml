name: CI
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  ci-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          version: "11.24.0"
          cache: true
      - name: Run linter
        run: pnpm run lint
      - name: Run type checker
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to Red Hat registry
        uses: docker/login-action@v4
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_CLIENTID }}
          password: ${{ secrets.REDHAT_CLIENT_SECRET }}

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUARY_USERNAME }}
          password: ${{ secrets.QUARY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build only
        run: |
          docker build -t code-review-agents .
