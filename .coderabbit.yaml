language: "ja-JP"
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary_in_walkthrough: true
  path_filters:
    - "!/.serena/*"
    - "!/.venv/*"
    - "!/node_modules/*"
    - "!/dist/*"
    - "!/.opencode/skills/graphify/*"
    - "!/.claude/skills/graphify/*"
    - "!/.claude/.worktrees/*"
    - "!/graphify-out/*"
    - "**/*.py"
    - "**/*.js"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.jsx"
    - "**/*.md"
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

