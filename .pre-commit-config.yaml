repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks-system

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.409
    hooks:
      - id: pyright

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.37
    hooks:
      - id: pymarkdown
        args: 
          - --config=.pymarkdown.json
          - scan
        files: \.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        types: [shell]
        language: unsupported
        entry: shellcheck
        args:
          - -x

      # TypeScript side of the toolchain (Issue #250). husky/lint-staged
      # is decided as the TS linter/formatter runner (see
      # docs/typescript-toolchain-spec.md), but the git hook entry point
      # itself stays owned by this pre-commit framework: core.hooksPath
      # is shared across all git worktrees of this repo, so switching it
      # to husky mid-Epic would silently disable pre-commit enforcement
      # (secret detection, ruff, etc.) in every concurrently checked-out
      # worktree that hasn't adopted the TS toolchain yet. Revisit this
      # once #255 removes the Python side entirely.
      - id: lint-staged
        name: lint-staged (biome)
        language: unsupported
        entry: nix develop --command pnpm exec lint-staged
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs|json)$
