repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks-system

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.37
    hooks:
      - id: pymarkdown
        args: 
          - --config=.pymarkdown.json
          - scan
        files: \.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        types: [shell]
        language: unsupported
        entry: shellcheck
        args:
          - -x

      # TypeScript side of the toolchain (Issue #250). lint-staged is the
      # TS linter/formatter runner (see docs/typescript-toolchain-spec.md
      # §2.5), but the git hook entry point itself stays owned by this
      # pre-commit framework: core.hooksPath is written to .git/config,
      # which is shared across all git worktrees of this repo, so pointing
      # it at husky would disable pre-commit enforcement (secret
      # detection, pymarkdown, etc.) in every other concurrently checked
      # out worktree. That constraint is not about Python coexisting with
      # TS -- it holds regardless of language -- so with Issue #255 having
      # removed the Python side entirely, the plan to revisit this at #255
      # is superseded: pre-commit remains the permanent hook entry point
      # and the husky dependency has been removed rather than promoted.
      - id: lint-staged
        name: lint-staged (biome)
        language: unsupported
        entry: nix develop --command pnpm exec lint-staged
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs|cjs|json)$
