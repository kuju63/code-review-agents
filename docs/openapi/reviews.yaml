    ReviewReportExample:
      summary: 結果 (mock pr-482 の Button.tsx 由来)
      value:
        apiVersion: '1.0.0'
        reviewId: pr-482
        attemptId: att-9f2c
        overallSummary: 認証フローの改善。セキュリティ観点で2件の対応推奨。
        commentCounts:
          total: 2
          open: 1
          resolved: 1
          falsePositive: 0
        files:
          - filePath: src/components/Button.tsx
            status: M
            additions: 3
            deletions: 2
            lines:
              - type: ctx
                oldLine: 12
                newLine: 12
                text: "  return ("
              - type: del
                oldLine: 14
                newLine: null
                text: "    <button onClick={onClick} disabled={disabled} className=\"btn\">"
              - type: add
                oldLine: null
                newLine: 14
                text: "    <button onClick={onClick} disabled={disabled || loading} className=\"btn\">"
            comments:
              - commentId: c1
                filePath: src/components/Button.tsx
                line: 12
                category: Style
                severity: low
                impactCategory: maintainability
                body: 'loading のような boolean フラグは isLoading のように is / has 接頭辞を付けると統一感が出ます。'
                disposition: resolved
              - commentId: c2
                filePath: src/components/Button.tsx
                line: 14
                category: Best Practice
                severity: medium
                impactCategory: maintainability
                body: '外部からも状態が伝わるよう aria-busy 属性の付与を推奨します。'
                disposition: open
